name: Update NBA Data

# Keeps nba_data.pkl fresh WITHOUT relying on the live app's on-page-load check —
# that check is intentionally lightweight (a couple of schedule lookups per visitor,
# see app.py's check_and_update_data()) and never runs the full multi-player scrape
# (career stats + game logs + shot charts for every player, plus League Trends /
# All-Star cohort data) inline in a request. This workflow is what actually keeps
# everything comprehensive and current.
#
# It also rebuilds nba_dashboard/data/*.json (build_data.py) — the static GitHub
# Pages site at rshiri.github.io/nba-dashboard/ reads only those JSON files, so
# nba_data.pkl alone updating is not enough to refresh it.

on:
  schedule:
    # Daily at 09:00 UTC — after West Coast games finish, before most visitors check in.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      player:
        description: "Only refresh one player (key from fetch_data.py PLAYERS, e.g. ben_saraf). Leave blank for everyone + shared league data."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest NBA data
        run: |
          if [ -n "${{ github.event.inputs.player }}" ]; then
            python fetch_data.py --player "${{ github.event.inputs.player }}"
          else
            python fetch_data.py
          fi

      - name: Rebuild static site JSON
        run: python build_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nba_data.pkl nba_dashboard/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh nba_data.pkl and static site data [automated]"
            git push
          fi
