<!doctype html>
<html lang="en" dir="ltr" data-style="c">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Israeli NBA Analytics - Ram Shiri</title>
  <meta name="description" content="Daily-updated analytics for every Israeli NBA player: game logs, career trends, shot maps and an All-Star comparison lab. Built by Ram Shiri." />
  <meta name="theme-color" content="#050b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet" />
  <!-- shared portfolio kit: the RAM/SHIRI bar with All projects, About, EN/HE and Style C/A,
       the same switches and localStorage keys (site-style, site-lang) as every project page -->
  <link rel="stylesheet" href="https://rshiri.github.io/assets/brand/brand.css" />
  <script src="https://rshiri.github.io/assets/brand/brand.js"></script>
  <script>/* mirror the kit's choice onto the attributes this dashboard's CSS uses, before first paint */
  (function () {
    var h = document.documentElement, s = h.getAttribute("data-site-style"), l = h.getAttribute("data-site-lang");
    try { if (!s) s = localStorage.getItem("site-style") === "a" ? "a" : "c"; if (!l) l = localStorage.getItem("site-lang") === "he" ? "he" : "en"; } catch (e) { s = s || "c"; l = l || "en"; }
    h.setAttribute("data-style", s); h.setAttribute("lang", l); h.setAttribute("dir", l === "he" ? "rtl" : "ltr");
  })();</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/plotly.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#page-content" data-i18n="skip">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#dashboard"><span data-i18n="brand_a">Israeli NBA</span><i class="b2">/</i><span class="b2" data-i18n="brand_b">Analytics</span></a>
    <span class="tb-player" id="topbar-player"></span>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="Player and page">
      <div class="side-row">
        <div class="field">
          <label class="field-label" for="player-select" data-i18n="player">Player</label>
          <select id="player-select"></select>
        </div>
        <div class="field page-field">
          <label class="field-label" for="page-select" data-i18n="page">Page</label>
          <select id="page-select"></select>
        </div>
      </div>

      <div class="player-card" id="player-card"></div>

      <nav aria-label="Pages"><ul class="nav" id="nav-list"></ul></nav>

      <div class="status-block" id="status-block"></div>

      <div class="sidebar-footer">
        <a href="https://github.com/RShiri/nba-dashboard" target="_blank" rel="noopener" data-i18n="source">View source on GitHub</a>
      </div>
    </aside>

    <main id="page-content" tabindex="-1">
      <p class="muted">Loading&hellip;</p>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
